name: Score submission
on:
  issues:
    types: [opened]
concurrency:
  group: leaderboard
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  score:
    if: startsWith(github.event.issue.title, '[제출]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/process_submission.py
      - name: Commit leaderboard
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add docs/leaderboard.json
          if ! git diff --cached --quiet; then
            git commit -m "update leaderboard (#${{ github.event.issue.number }})"
            git push
          fi
      - name: Reply and close
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
          gh issue close "${{ github.event.issue.number }}"
