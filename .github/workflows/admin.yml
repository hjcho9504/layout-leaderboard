name: Admin - delete records
on:
  workflow_dispatch:
    inputs:
      action:
        description: 동작
        type: choice
        options: [delete_entry, reset_case]
      case:
        description: Case 번호
        type: choice
        options: ["1", "2", "3", "4", "5"]
      user:
        description: "delete_entry일 때 삭제할 GitHub 아이디"
        required: false
concurrency:
  group: leaderboard
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply
        env:
          A: ${{ inputs.action }}
          C: ${{ inputs.case }}
          U: ${{ inputs.user }}
        run: python scripts/admin.py "$A" "$C" "$U"
      - name: Commit
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add docs/leaderboard.json
          git diff --cached --quiet || (git commit -m "admin: ${{ inputs.action }} case ${{ inputs.case }}" && git push)
